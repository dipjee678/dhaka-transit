<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Map — Dhaka Transit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">DT</span>
        <span>Dhaka Transit<span class="brand-sub">Open GTFS &amp; Multimodal Planner</span></span>
      </a>
      <button id="nav-toggle" class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <nav aria-label="Main navigation">
        <ul id="nav-links" class="nav-links">
          <li><a href="index.html" data-page="home">Home</a></li>
          <li><a href="map.html" data-page="map">Map</a></li>
          <li><a href="results.html" data-page="results">Route Planner</a></li>
          <li><a href="dataset.html" data-page="dataset">Open Dataset</a></li>
          <li><a href="about.html" data-page="about">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="map-page-shell">
    <aside class="map-sidebar" aria-label="Map layers and stop explorer">
      <div>
        <h1 class="section-title" style="margin-bottom:4px;">Dhaka Transit Map</h1>
        <p id="map-status" class="muted" style="margin:0;font-size:0.82rem;" role="status">Loading transit layers…</p>
      </div>

      <div>
        <div class="form-label"><span>Map Layers</span></div>
        <label class="layer-toggle">
          <span><span class="dot" style="background:#006E34"></span>MRT Line 6 Track</span>
          <input id="layer-metro-track" type="checkbox" checked />
        </label>
        <label class="layer-toggle">
          <span><span class="dot" style="background:#fff;border:2px solid #006E34"></span>MRT Line 6 Stations (16)</span>
          <input id="layer-metro-stations" type="checkbox" checked />
        </label>
        <label class="layer-toggle">
          <span><span class="dot" style="background:#F59E0B"></span>OSM Bus Stops (1,023)</span>
          <input id="layer-osm-bus" type="checkbox" checked />
        </label>

        <div class="form-group" style="margin-top:8px;">
          <label class="form-label" for="osm-kind-filter"><span>Filter OSM bus-stop kind</span></label>
          <select id="osm-kind-filter" class="input">
            <option value="">All mapped kinds (1,023)</option>
            <option value="platform">Platform (434)</option>
            <option value="stop_position">Stop position (317)</option>
            <option value="bus_stop">Highway bus_stop (152)</option>
            <option value="bus_station">Bus station / terminal (120)</option>
          </select>
        </div>
      </div>

      <div>
        <div class="form-label"><span>Click anywhere on the map for nearby stations</span></div>
        <ul id="nearby-results" class="list-compact">
          <li class="muted" style="font-size:0.82rem;">Click any point in Dhaka to calculate walking distance &amp; time to nearby GTFS stops.</li>
        </ul>
      </div>

      <div>
        <label class="form-label" for="map-search"><span>MRT Line 6 Stations (English / বাংলা)</span></label>
        <input id="map-search" class="input" type="search" placeholder="Filter stations…" style="margin-bottom:8px;" />
        <ul id="station-list" class="list-compact"></ul>
      </div>
    </aside>

    <section aria-label="Full-screen Dhaka Leaflet map" style="position:relative;">
      <div id="full-map" class="map-full"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="js/map_page.js"></script>
</body>
</html>
